<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeismoTwin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --accent-color: #ff0055;
            --bg-dark: #050510;
            --bg-grid: rgba(0, 242, 254, 0.05);
            --text-color: #e0e0e0;
            --glass-bg: rgba(10, 20, 40, 0.7);
            --glass-border: rgba(0, 242, 254, 0.3);
            --tech-font: 'Rajdhani', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image:
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-color);
            font-family: var(--tech-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
            /* Allow scrolling */
        }

        /* Ambient Glow */
        body::before {
            content: '';
            position: absolute;
            width: 150vw;
            height: 150vh;
            background: radial-gradient(circle at center, rgba(0, 242, 254, 0.05) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Title Glitch Effect */
        h1 {
            position: relative;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 4rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color);
            animation: glitch-text 3s infinite linear alternate-reverse;
        }

        h1::before,
        h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
        }

        h1::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent-color);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        h1::after {
            left: -2px;
            text-shadow: -2px 0 var(--secondary-color);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% {
                clip: rect(18px, 9999px, 86px, 0);
            }

            20% {
                clip: rect(6px, 9999px, 14px, 0);
            }

            40% {
                clip: rect(62px, 9999px, 24px, 0);
            }

            60% {
                clip: rect(32px, 9999px, 78px, 0);
            }

            80% {
                clip: rect(89px, 9999px, 12px, 0);
            }

            100% {
                clip: rect(48px, 9999px, 54px, 0);
            }
        }

        @keyframes glitch-anim2 {
            0% {
                clip: rect(65px, 9999px, 91px, 0);
            }

            20% {
                clip: rect(12px, 9999px, 34px, 0);
            }

            40% {
                clip: rect(83px, 9999px, 5px, 0);
            }

            60% {
                clip: rect(2px, 9999px, 64px, 0);
            }

            80% {
                clip: rect(46px, 9999px, 28px, 0);
            }

            100% {
                clip: rect(9px, 9999px, 73px, 0);
            }
        }

        /* ภาชนะใส่เกม styled as Tech Frame */
        #game-container {
            position: relative;
            width: 960px;
            height: 600px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.1);
            backdrop-filter: blur(5px);
            z-index: 10;
        }



        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* หน้าโหลด (Loading) - Tech Signal Style */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.5s;
        }

        .signal-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 60px;
        }

        .bar {
            width: 6px;
            background: var(--primary-color);
            animation: equalize 1s ease-in-out infinite;
            box-shadow: 0 0 10px var(--primary-color);
        }

        .bar:nth-child(1) {
            height: 20px;
            animation-delay: -0.4s;
        }

        .bar:nth-child(2) {
            height: 40px;
            animation-delay: -0.2s;
        }

        .bar:nth-child(3) {
            height: 60px;
            animation-delay: 0s;
        }

        .bar:nth-child(4) {
            height: 40px;
            animation-delay: -0.2s;
        }

        .bar:nth-child(5) {
            height: 20px;
            animation-delay: -0.4s;
        }

        @keyframes equalize {

            0%,
            100% {
                height: 20%;
                opacity: 0.5;
            }

            50% {
                height: 100%;
                opacity: 1;
            }
        }

        .loading-text {
            margin-top: 25px;
            color: var(--primary-color);
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: blink 1s infinite;
        }

        /* Fullscreen Icon Button */
        #fullscreen-btn {
            position: absolute;
            bottom: 20px;
            /* Moved to bottom */
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            /* Techy square look */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
        }

        #fullscreen-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--primary-color);
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 2px var(--primary-color));
        }

        #fullscreen-btn:hover {
            background: rgba(0, 242, 254, 0.2);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            transform: scale(1.05);
            border-color: #fff;
        }

        #fullscreen-btn:hover svg {
            fill: #fff;
            filter: drop-shadow(0 0 5px #fff);
        }

        /* Tech decorative lines for button */
        #fullscreen-btn::before,
        #fullscreen-btn::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            border: 1px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        #fullscreen-btn::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        #fullscreen-btn::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        #fullscreen-btn:hover::before,
        #fullscreen-btn:hover::after {
            width: 100%;
            height: 100%;
            opacity: 0;
        }

        /* ย่อเกมเมื่อจอเล็ก */
        /* ย่อเกมเมื่อจอเล็ก */
        @media (max-width: 1000px) {
            #game-container {
                width: 95vw;
                height: 59.375vw;
            }

            h1 {
                font-size: 2.5rem;
            }

            #fullscreen-btn {
                width: 36px;
                height: 36px;
                top: auto;
                bottom: 10px;
                right: 10px;
            }

            #fullscreen-btn svg {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>

<body>

    <h1 data-text="SEISMOTWIN">SEISMOTWIN</h1>

    <div id="game-container">


        <!-- Fullscreen Icon Button -->
        <button id="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
            <svg viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
            </svg>
        </button>

        <canvas id="unity-canvas"></canvas>

        <div id="loading-overlay">
            <div class="signal-loader">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <div class="loading-text">SYSTEM INITIALIZING...</div>
        </div>
    </div>

    <script>
        // --- ส่วนที่แก้ไขให้ตรงกับไฟล์ในรูปของคุณ ---

        // 1. ไฟล์ Loader (ในรูปคุณเป็นตัว B ใหญ่)
        var loaderUrl = "Build/Build.loader.js";

        // 2. ตั้งค่าไฟล์ต่างๆ (ผมเลือกไฟล์ที่ไม่ลงท้ายด้วย .gz เพื่อความง่าย)
        var config = {
            // ในรูปมีไฟล์ webgl.data (ตัวเล็ก) น่าจะเป็นไฟล์ Data ที่ถูกต้อง
            dataUrl: "Build/webgl.data",

            // ในรูปไฟล์ framework เป็นตัว b เล็ก (build.framework.js)
            frameworkUrl: "Build/build.framework.js",

            // ในรูปไฟล์ wasm เป็นตัว b เล็ก (build.wasm)
            codeUrl: "Build/build.wasm",

            streamingAssetsUrl: "StreamingAssets",
            companyName: "MyCompany",
            productName: "MyGame",
            productVersion: "1.0",
        };

        var container = document.querySelector("#game-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingOverlay = document.querySelector("#loading-overlay");
        var unityGameInstance = null;

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                // ส่วนนี้ใช้แสดง Progress Bar ได้ (ตอนนี้ใช้วงกลมหมุนแทน)
            }).then((unityInstance) => {
                unityGameInstance = unityInstance;
                loadingOverlay.style.opacity = "0";
                setTimeout(() => loadingOverlay.style.display = "none", 500);
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);

        function toggleFullscreen() {
            if (unityGameInstance) {
                unityGameInstance.SetFullscreen(1);
            }
        }
    </script>
</body>

</html>
