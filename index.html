<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeismoTwin</title>
    <style>
        @font-face {
            font-family: 'Play';
            src: url('./Play-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --primary-color: #00f2fe;
            --secondary-color: #4facfe;
            --bg-dark: #0f0c29;
            --bg-mid: #16263b;
            --bg-light: #24243e;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid), var(--bg-light));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-color);
            font-family: 'Play', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        h1 {
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 3rem;
            letter-spacing: 4px;
            /* text-transform: uppercase; Removed as requested */
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
            animation: fadeInDown 1s ease-out;
        }

        /* ภาชนะใส่เกม */
        #game-container {
            position: relative;
            width: 960px;
            height: 600px;
            background: #000;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(79, 172, 254, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* หน้าโหลด (Loading) */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 242, 254, 0.1);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .loading-text {
            margin-top: 15px;
            color: var(--primary-color);
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ปุ่มกด */
        .controls {
            margin-top: 25px;
            animation: fadeInUp 1s ease-out 0.6s backwards;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 12px 30px;
            font-family: 'Play', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* ย่อเกมเมื่อจอเล็ก */
        @media (max-width: 1000px) {
            #game-container {
                width: 90vw;
                height: 56.25vw;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <h1>SeismoTwin</h1>

    <div id="game-container">
        <canvas id="unity-canvas"></canvas>
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text">LOADING...</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <div class="background-cracks">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
            <path class="crack" d="M0,0 L15,20 L10,35 L25,50 L20,70 L35,85 L40,100"
                vector-effect="non-scaling-stroke" />
            <path class="crack" d="M100,0 L85,25 L90,40 L70,60 L75,80 L60,100" vector-effect="non-scaling-stroke"
                style="animation-delay: 2s;" />
            <path class="crack small" d="M50,100 L55,80 L45,60 L50,55" vector-effect="non-scaling-stroke"
                style="animation-delay: 4s;" />

            <!-- New Cracks -->
            <path class="crack" d="M0,50 L20,45 L35,55 L50,40 L70,45 L100,50" vector-effect="non-scaling-stroke"
                style="animation-delay: 1s;" />
            <path class="crack small" d="M20,0 L25,15 L15,30 L30,40" vector-effect="non-scaling-stroke"
                style="animation-delay: 3s;" />
            <path class="crack small" d="M80,100 L75,85 L85,70 L70,60" vector-effect="non-scaling-stroke"
                style="animation-delay: 5s;" />
            <path class="crack" d="M0,100 L30,70 L20,50 L40,30 L10,0" vector-effect="non-scaling-stroke"
                style="opacity: 0.15; animation-duration: 10s;" />
            <path class="crack small" d="M60,0 L65,20 L55,40 L70,50" vector-effect="non-scaling-stroke"
                style="animation-delay: 6s;" />
        </svg>
    </div>

    <style>
        .background-cracks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.4;
        }

        .background-cracks svg {
            width: 100%;
            height: 100%;
        }

        .crack {
            fill: none;
            stroke: rgba(0, 242, 254, 0.3);
            /* Primary color low opacity */
            stroke-width: 0.5px;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            filter: drop-shadow(0 0 2px var(--primary-color));
            animation: crackDraw 8s ease-in-out infinite;
        }

        .crack.small {
            stroke-width: 0.2px;
        }

        @keyframes crackDraw {
            0% {
                stroke-dashoffset: 100;
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            50% {
                stroke-dashoffset: 0;
            }

            80% {
                opacity: 0;
            }

            100% {
                stroke-dashoffset: 0;
                opacity: 0;
            }
        }
    </style>

    <script>
        // --- ส่วนที่แก้ไขให้ตรงกับไฟล์ในรูปของคุณ ---

        // 1. ไฟล์ Loader (ในรูปคุณเป็นตัว B ใหญ่)
        var loaderUrl = "Build/Build.loader.js";

        // 2. ตั้งค่าไฟล์ต่างๆ (ผมเลือกไฟล์ที่ไม่ลงท้ายด้วย .gz เพื่อความง่าย)
        var config = {
            // ในรูปมีไฟล์ webgl.data (ตัวเล็ก) น่าจะเป็นไฟล์ Data ที่ถูกต้อง
            dataUrl: "Build/webgl.data",

            // ในรูปไฟล์ framework เป็นตัว b เล็ก (build.framework.js)
            frameworkUrl: "Build/build.framework.js",

            // ในรูปไฟล์ wasm เป็นตัว b เล็ก (build.wasm)
            codeUrl: "Build/build.wasm",

            streamingAssetsUrl: "StreamingAssets",
            companyName: "MyCompany",
            productName: "MyGame",
            productVersion: "1.0",
        };

        var container = document.querySelector("#game-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingOverlay = document.querySelector("#loading-overlay");
        var unityGameInstance = null;

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                // ส่วนนี้ใช้แสดง Progress Bar ได้ (ตอนนี้ใช้วงกลมหมุนแทน)
            }).then((unityInstance) => {
                unityGameInstance = unityInstance;
                loadingOverlay.style.opacity = "0";
                setTimeout(() => loadingOverlay.style.display = "none", 500);
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);

        function toggleFullscreen() {
            if (unityGameInstance) {
                unityGameInstance.SetFullscreen(1);
            }
        }
    </script>
</body>

</html>
